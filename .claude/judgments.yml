# 判断台帳。「いまは直さない」と決めたものを覚えておく。
#
# 消せばまた指摘される。判断が変わったら消すか、why を書き直す。
# until を書くと、その日を過ぎたときにもう一度言う。運営の判断はたいてい期限付き。

judgments:
  - key: "docs:models_screenshot_caption"
    path: README.md
    decision: "このリポジトリでは直さない"
    why: "2026-09-06 に /models が独立した画面へ戻ったので、キャプション「モデル管理 — 学習・切替・バックテストを画面から実行」は正しくなった。残る問題は 2 つ: (a)「ダッシュボード画面」というキャプション (dashboard.png) が指す画面はもう無い、(b) 5 枚すべて Topbar が旧タブ (DASHBOARD 有り) のまま。ただし該当行 (123-135) は portfolio:begin〜end の内側で portfolio-site の projects.ts からの生成物なので、直しても次の生成で消える。直す場所は portfolio-site 側"
    at: 181
    date: 2026-09-05
    by: "/design --renew"
  - key: "docs:font_weight_600_not_loaded"
    path: docs/ui-style.md
    decision: "docs には食い違いとして書き、コードは直さない"
    why: "index.html が読み込むのは 400/500/700 で 600 は無いのに、font-semibold (600) を PageHeader / SectionHeading など 6 か所で使っている。ブラウザが近いウェイトへ落とすので Inter と Noto Sans JP で別々にずれる — ui-style.md『デザイントークン』が避けようとした壊れ方そのもの。直し方は 3 通り (700 にする / 600 を読み込む / 500 に戻す) あって、どれも見た目の判断なので /docs では選べない。ui-style.md に『未解決』と明記して逃がした。次の /design で決める"
    until: 2026-12-31
    date: 2026-09-07
    by: "/docs"

  - key: "docs:place_roi_four_values_same_era"
    path: docs/ai-model.md
    decision: "数字を揃えない"
    why: "19ヶ月窓あたりの複勝回収率が 0.885 (:736 券種別表・5,402 点) / 0.887 (:513 EV 廃止の効果表) / 0.889 (:581 低情報レースの群別表・5,390 レース) / README の 0.886 と 4 通りある。duplication-auditor は同じ窓の食い違いと見たが、レース数が 5,390 と 5,402 で違い、買い方も表ごとに違う可能性がある。どれが正かは docs を読んでも決まらず、決めるには測り直しが要る。文書側で 1 つ選んで書き換えると、測っていない数字を正本にすることになるので触らない"
    until: 2026-12-31
    date: 2026-09-07
    by: "/docs"

  - key: "docs:dashboard_in_backend_comments"
    path: backend/src/ai/evaluation/backtest.py
    decision: "この差分では直さない"
    why: "Dashboard という画面は 2026-09-06 に無くなり /models になったが、backtest.py に 8 か所・api/schemas.py:204 に 1 か所コメントが残っている。うち backtest.py:932 は --persist の --help に出る文字列なので利用者に見える。docs ではなくコードなので /docs の範囲外。次に backtest.py を触るときか /code で直す"
    until: 2026-12-31
    date: 2026-09-07
    by: "/docs"

  - key: "design:dashboard_screenshot_has_no_screen"
    path: docs/images/dashboard.png
    decision: "このリポジトリでは直さない"
    why: "2026-09-07 に race-list / race-detail / models / ledger の 4 枚は撮り直したが、dashboard.png だけ**対応する画面がもう無い** (2026-09-06 に /models へ統合)。README のキャプション「ダッシュボード — モデル成績の概観」ごと portfolio:begin〜end の内側にあり、直す場所は portfolio-site の projects.ts。こちらで別の画面を入れても、キャプションが合わないまま残る。画像は旧 Topbar のままなので、portfolio-site 側で行を消すか Model Detail に差し替えるまでは古い絵が出る"
    until: 2026-12-31
    date: 2026-09-07
    by: "/design"

  - key: "data:ledger_filled_from_recommendations"
    path: data/keiba.db
    decision: "残す (消し方を書いておく)"
    why: "台帳に active モデル (ID 1) の推奨買目を 15,387 点入れてある (2025-09-06〜2026-08-23・105 開催日・3,306 レース・全レース対象)。レース・オッズ・払戻はすべて実在し実払戻で確定させているが、**実際に買った記録ではない**。active の学習期間は 2024-04-28 までなので全部 out-of-sample。購入日時と確定日時は API が入れる実行時刻ではなく、レース番号から作ったレース当日の時刻に直してある (そうしないと全部が今日になり、損益推移が 1 点になって明細も race 順に並ばない)。消すときは source で引ける: DELETE FROM bet_records WHERE source = 'recommendation'。入れ直す手順は docs/operations.md には書いていない — 一度きりの流し込みで、繰り返す道具にはしていない"
    until: 2026-12-31
    date: 2026-09-07
    by: "/design"

